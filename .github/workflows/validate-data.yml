name: Validate contributed data

on:
  pull_request:
    paths:
      - "data/submissions/**"
      - "scripts/validate_submissions.py"
      - "scripts/build_dataset.py"
      - "scripts/build_readme_visual.py"
      - "scripts/convert_sysu_clipboard.py"
      - "tests/**"
      - "community-data.js"
      - "assets/readme/hero.svg"
  push:
    branches: [main]
    paths:
      - "data/submissions/**"
      - "scripts/validate_submissions.py"
      - "scripts/build_dataset.py"
      - "scripts/build_readme_visual.py"
      - "scripts/convert_sysu_clipboard.py"
      - "tests/**"
      - "community-data.js"
      - "assets/readme/hero.svg"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CSV submissions
        run: python scripts/validate_submissions.py
      - name: Verify generated browser data
        run: python scripts/build_dataset.py --check
      - name: Verify README data visual
        run: python scripts/build_readme_visual.py --check
      - name: Test SYSU clipboard converter
        run: python -m unittest discover -s tests
