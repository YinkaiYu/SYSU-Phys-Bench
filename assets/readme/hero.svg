<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">SYSU-Phys-Bench</title>
  <desc id="description">把课程给分放到同一把尺上的基准测试项目视觉</desc>
  <defs>
    <linearGradient id="background" x1="58" y1="28" x2="1138" y2="444" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c2028"/>
      <stop offset=".57" stop-color="#163845"/>
      <stop offset="1" stop-color="#244e61"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(310 223) rotate(18) scale(285 245)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5da0ba" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5da0ba" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="274" y1="112" x2="274" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7fbfc"/>
      <stop offset="1" stop-color="#b9d3dd"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#061318" flood-opacity=".34"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#d9edf3" stroke-opacity=".055"/>
    </pattern>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="460" rx="30" fill="url(#background)"/>
  <rect width="1200" height="460" rx="30" fill="url(#grid)"/>
  <rect width="1200" height="460" rx="30" fill="url(#glow)"/>

  <g opacity=".38" fill="none" stroke="#8ec0d2">
    <path d="M53 376C223 297 326 351 465 267C578 199 623 103 764 72" stroke-opacity=".18"/>
    <path d="M807 395C929 345 1036 324 1165 218" stroke-opacity=".14"/>
    <circle cx="87" cy="361" r="4" fill="#62a9c4" stroke="none"/>
    <circle cx="445" cy="279" r="4" fill="#d58ba4" stroke="none"/>
    <circle cx="759" cy="75" r="4" fill="#98a86a" stroke="none"/>
    <circle cx="1031" cy="328" r="4" fill="#dd784e" stroke="none"/>
    <circle cx="1158" cy="223" r="4" fill="#d9aa58" stroke="none"/>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="126" y="68" width="296" height="296" rx="68" fill="#0e252e" fill-opacity=".72" stroke="#c9e0e8" stroke-opacity=".15"/>
    <path d="M170 122H378M170 216H378M170 310H378M180 112V320M274 112V320M368 112V320" fill="none" stroke="#d9edf3" stroke-opacity=".07"/>
    <path d="M206 137C218 176 241 199 274 218C307 199 330 176 342 137" fill="none" stroke="url(#mark)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M274 218V305" fill="none" stroke="url(#mark)" stroke-width="17" stroke-linecap="round"/>
    <path d="M222 313H326" fill="none" stroke="#d9aa58" stroke-width="10" stroke-linecap="round"/>
    <circle cx="206" cy="137" r="17" fill="#62a9c4" stroke="#f7fbfc" stroke-width="5"/>
    <circle cx="342" cy="137" r="17" fill="#dd784e" stroke="#f7fbfc" stroke-width="5"/>
    <circle cx="274" cy="218" r="17" fill="#d9aa58" stroke="#fff7e8" stroke-width="5"/>
  </g>

  <g transform="translate(506 0)">
    <text x="0" y="188" fill="#f7fbfc" font-size="58" font-weight="760" letter-spacing="-.02em">SYSU-Phys-Bench</text>
    <path d="M2 218H574" stroke="#9fc2cf" stroke-opacity=".32"/>
    <text x="0" y="280" fill="#dce9ee" font-size="32" font-weight="560">把课程给分，放到同一把尺上。</text>
    <g transform="translate(0 326)">
      <path d="M0 0H92" stroke="#d9aa58" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="6" fill="#d9aa58"/>
      <circle cx="46" cy="0" r="6" fill="#d9aa58"/>
      <circle cx="92" cy="0" r="6" fill="#d9aa58"/>
    </g>
  </g>
</svg>
