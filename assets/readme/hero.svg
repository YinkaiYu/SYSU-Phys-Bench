<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">SYSU-Phys-Bench</title>
  <desc id="description">把课程给分的系统偏差还给课程，如此留下的是我们自身水平的真实</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="16" x2="1160" y2="446" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091b22"/>
      <stop offset=".56" stop-color="#153744"/>
      <stop offset="1" stop-color="#244e61"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(262 230) scale(292)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5fa7c0" stop-opacity=".24"/>
      <stop offset="1" stop-color="#5fa7c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="axis" x1="260" y1="104" x2="260" y2="356" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bed7e0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#061318" flood-opacity=".38"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#d9edf3" stroke-opacity=".045"/>
    </pattern>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="460" rx="30" fill="url(#background)"/>
  <rect width="1200" height="460" rx="30" fill="url(#grid)"/>
  <rect width="1200" height="460" rx="30" fill="url(#halo)"/>

  <g opacity=".24" fill="none">
    <circle cx="209" cy="230" r="174" stroke="#66abc4"/>
    <circle cx="311" cy="230" r="174" stroke="#d8a64f"/>
    <path d="M58 230H450" stroke="#dcebf0" stroke-opacity=".34"/>
    <path d="M260 42V418" stroke="#dcebf0" stroke-opacity=".24"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="260" cy="230" r="132" fill="#0c252e" fill-opacity=".82" stroke="#d8e8ee" stroke-opacity=".15"/>
    <path d="M260 154C195 154 158 184 158 230S195 306 260 306" fill="none" stroke="#66abc4" stroke-width="24" stroke-linecap="round"/>
    <path d="M260 154C325 154 362 184 362 230S325 306 260 306" fill="none" stroke="#d8a64f" stroke-width="24" stroke-linecap="round"/>
    <path d="M260 104V356" fill="none" stroke="url(#axis)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="260" cy="230" r="13" fill="#ffffff"/>
  </g>

  <g transform="translate(476 0)">
    <text x="0" y="154" fill="#f7fbfc" font-size="58" font-weight="760" letter-spacing="-.025em">SYSU-Phys-Bench</text>
    <path d="M2 187H626" stroke="#9fc2cf" stroke-opacity=".34"/>
    <text x="0" y="244" fill="#e2edf1" font-size="27" font-weight="520">
      <tspan x="0" dy="0">把课程给分的系统偏差还给课程，</tspan>
      <tspan x="0" dy="48">如此留下的是我们自身水平的真实</tspan>
    </text>
    <path d="M0 336H106" stroke="#d8a64f" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
